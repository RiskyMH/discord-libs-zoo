name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build-all.sh

      - name: Test
        if: ${{ env.DISCORD_TOKEN != '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: ./test-all.sh
